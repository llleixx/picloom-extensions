name: Prepare draft Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: New release tag
        required: true
        type: string
      extensions:
        description: Space-separated extension paths (empty selects all)
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: extension-release
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  draft:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/download-artifact@v4
        with:
          name: extensions
          path: dist
      - run: bun scripts/release.ts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          EXTENSIONS: ${{ inputs.extensions }}
